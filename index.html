 if(sp>.3){const ta=Math.atan2(vx,vz);let da=ta-face;da=Math.atan2(Math.sin(da),Math.cos(da));face+=da*Math.min(1,dt*8)}
 else if(m<.05){}
 walk+=sp*dt*1.4;const fx=Math.sin(face),fz=Math.cos(face);
 ch.position.set(bx-fx*(rVis+.5),0,bz-fz*(rVis+.5));ch.rotation.y=face;cb.position.y=Math.abs(Math.sin(walk))*.12;
 lf.position.z=Math.sin(walk)*.3;rf.position.z=-Math.sin(walk)*.3;
 // dust
 if(sp>3&&Math.random()<dt*50)emit(bx-vx*.1+(Math.random()-.5)*rVis,.2,bz-vz*.1+(Math.random()-.5)*rVis,(Math.random()-.5),1+Math.random(),(Math.random()-.5),boost>0?0xffe066:0xe8dcc0,.5);
 for(let i=0;i<NP;i++)if(pl[i]>0){pl[i]-=dt;pv[i*3+1]-=9*dt;for(let a=0;a<3;a++)pp[i*3+a]+=pv[i*3+a]*dt;if(pl[i]<=0)pp[i*3+1]=-999}
 pg.attributes.position.needsUpdate=true;pg.attributes.color.needsUpdate=true;pts.material.size=.3+rVis*.1;
 // rings
 nl.sort((a,b)=>a[0]-b[0]);const pu=1+Math.sin(time*6)*.08;
 rings.forEach((r,i)=>{const q=nl[i];if(!q){r.visible=false;return}r.visible=true;r.material=q[2]?gM:rM;r.position.x=q[1].position.x;r.position.z=q[1].position.z;r.scale.setScalar((q[1].userData.s*1.1+.3)*(q[2]?pu:1))});
 // camera
 setCam(dt);
 
 hudT-=dt;if(hudT<=0){hudT=.1;hud()}
}
function setCam(dt){sun.castShadow=!!save.q;{const e=22+rVis*6,c=sun.shadow.camera;if(Math.abs(c.right-e)>.5){c.left=-e;c.right=e;c.top=e;c.bottom=-e;c.far=e*6;c.updateProjectionMatrix()}sun.position.set(bx+e*.6,e*2.2,bz+e*.4);sun.target.position.set(bx,0,bz);sun.target.updateMatrixWorld()}
 const dist=(7+rVis*3.4)*zoom,ph=pitch;
 let x=bx+Math.sin(yaw)*Math.cos(ph)*dist,y=rVis*.7+Math.sin(ph)*dist+1,z=bz+Math.cos(yaw)*Math.cos(ph)*dist;
 for(const o of objs){const s=o.userData.s;if(s<rT*1.2||!o.visible)continue;const ex=x-o.position.x,ez=z-o.position.z,ed=Math.hypot(ex,ez),l=s*.95;if(ed<l&&ed>1e-3){x=o.position.x+ex/ed*l;z=o.position.z+ez/ed*l}}
 shake=Math.max(0,shake-dt*1.5);
 cam.position.set(x+(Math.random()-.5)*shake*rVis*.3,Math.max(1,y)+(Math.random()-.5)*shake*rVis*.3,z);
 cam.lookAt(bx,rVis*.8,bz);
 const tf=(boost>0?66:55)+(power>0?6:0);cam.fov+=(tf-cam.fov)*Math.min(1,(dt||.016)*4);cam.updateProjectionMatrix();
}
function hud(){
 $('hSize').textContent='⚪ '+fmt(rVis);$('hStage').textContent=STAGES[stage][1]+(boost>0?' · ⚡가속':'')+(power>0?' · 🔋×1.3 '+power.toFixed(1)+'s':'');
 const a=STAGES[stage][0],nx=stage<5?STAGES[stage+1][0]:WIN,pc=Math.max(0,Math.min(1,(rT-a)/(nx-a)));
 $('fill').style.width=pc*100+'%';$('hNext').textContent=stage<5?'다음: '+STAGES[stage+1][1]:'목표: '+fmt(WIN);
 $('hN').textContent='🧺 '+n+'개';const s=Math.floor(time);$('hT').textContent='⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function finish(win){
 if(state!='play')return;state='end';
 const sz=rT*20;if(sz>save.best)save.best=sz;if(n>save.bestN)save.bestN=n;persist();
 $('hud').classList.add('hide');$('end').classList.remove('hide');
 $('eT').textContent=win?'🎉 거대 볼 완성!':'수고했어요!';
 const s=Math.floor(time);
 $('eS').innerHTML='최종 크기: <b>'+fmt(rT)+'</b> ('+STAGES[stage][1]+')<br>흡수한 사물: <b>'+n+'개</b><br>플레이 시간: <b>'+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'</b><br>최고 기록: '+fmt(save.best/20)+' · '+save.bestN+'개';
 snd(600,.5,'triangle',.2,2);
}
function start(){newGame();state='play';['menu','end'].forEach(i=>$(i).classList.add('hide'));$('hud').classList.remove('hide');
 $('hint').textContent=matchMedia('(pointer:coarse)').matches?'왼쪽 조이스틱: 이동 · 오른쪽 드래그: 카메라':'WASD/방향키: 이동 · 드래그: 카메라 · 휠: 줌';
 try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function home(){state='menu';$('end').classList.add('hide');$('menu').classList.remove('hide');rec()}
function rec(){$('rec').textContent=save.best?'최고 기록: '+fmt(save.best/20)+' · '+save.bestN+'개':''}
function showDex(){$('dexList').innerHTML=TY.filter(t=>!t.bat).map(t=>save.dex[t.id]>0?t.e+' '+t.n+' ×'+save.dex[t.id]:'❓ ???').map(x=>'<div>'+x+'</div>').join('');$('dex').classList.remove('hide')}
function setLbl(){$('bSnd').textContent='소리: '+(save.snd?'켜짐':'꺼짐');$('bQ').textContent='화질: '+(save.q?'높음':'낮음')}

// ---------- UI wiring
$('bStart').onclick=start;$('bAgain').onclick=start;$('bHome').onclick=home;$('fin').onclick=()=>finish(false);
$('bDex').onclick=showDex;$('dexX').onclick=()=>$('dex').classList.add('hide');
$('bSet').onclick=()=>{setLbl();$('set').classList.remove('hide')};$('setX').onclick=()=>{persist();$('set').classList.add('hide')};
$('bSnd').onclick=()=>{save.snd=save.snd?0:1;setLbl()};$('bQ').onclick=()=>{save.q=save.q?0:1;setLbl();resize()};

// ---------- input
addEventListener('keydown',e=>{keys[e.code]=1;if(state=='play'&&e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=0);
addEventListener('wheel',e=>{zoom=Math.max(.6,Math.min(2.6,zoom*(1+e.deltaY*.001)))},{passive:true});
let joy=null,drag=null;const cvs=R.domElement,jEl=$('joy'),kEl=$('knob');
cvs.addEventListener('pointerdown',e=>{if(state!='play')return;cvs.setPointerCapture(e.pointerId);
 if(e.pointerType=='touch'&&e.clientX<innerWidth/2&&!joy){joy={id:e.pointerId,x:e.clientX,y:e.clientY};for(const el of[jEl,kEl]){el.style.left=e.clientX+'px';el.style.top=e.clientY+'px';el.classList.remove('hide')}}
 else if(!drag)drag={id:e.pointerId,x:e.clientX,y:e.clientY}});
cvs.addEventListener('pointermove',e=>{
 if(joy&&e.pointerId==joy.id){let dx=(e.clientX-joy.x)/50,dy=(e.clientY-joy.y)/50;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}jx2=dx;jy2=-dy;kEl.style.left=joy.x+dx*50+'px';kEl.style.top=joy.y+dy*50+'px'}
 else if(drag&&e.pointerId==drag.id){yaw-=(e.clientX-drag.x)*.006;pitch=Math.max(.15,Math.min(1.25,pitch+(e.clientY-drag.y)*.004));drag.x=e.clientX;drag.y=e.clientY}});
const up=e=>{if(joy&&e.pointerId==joy.id){joy=null;jx2=jy2=0;jEl.classList.add('hide');kEl.classList.add('hide')}if(drag&&e.pointerId==drag.id)drag=null};
cvs.addEventListener('pointerup',up);cvs.addEventListener('pointercancel',up);

// ---------- loop
const clock=new T.Clock();
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);
 if(state=='play')update(dt);
 else{yaw+=dt*.25;rVis=.5;rT=.5;root.position.set(0,.5,0);core.scale.setScalar(.5);bg.rotation.y+=dt*.5;ch.position.set(0,0,-1.1);ch.rotation.y=0;cb.position.y=Math.abs(Math.sin(time*5))*.1;time+=dt;setCam(dt)}
 R.render(scene,cam)}
newGame();rec();frame();
</script></body></html>
